[tool.ruff]
include = ["infra", "services"]
line-length = 100
target-version = "py312"
lint.extend-select = ["B", "I", "E", "F", "W"]
lint.extend-ignore = ["E501"]
fix = true


[tool.black]
line-length = 100
target-version = ["py312"]


[tool.pyright]
include = ["infra", "services"]
exclude = [".venv", ".ruff_cache", ".pytest_cache", "__pycache__"]
typeCheckingMode = "strict"


pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["services"]
pythonpath = ["."]
python_files = ["*_test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
